name: Verificar estructura Isekaid

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar disposición del repositorio y escenas
        run: python tools/verify_unified_layout.py
      - name: Validar biblioteca narrativa y recurso runtime
        run: python tools/build_f3a_runtime_content.py --check
